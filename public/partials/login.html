  <div class="login-container">
    <div class="login-logo">🏥</div>
    <h2>ระบบจัดเวรพยาบาล<br>โรงพยาบาลลำพูน</h2>
    <div class="alert alert-info" style="font-size:11px">กรุณาเข้าสู่ระบบเพื่อใช้งาน</div>
    <div id="loginNotice"></div>
    <div class="form-group">
      <label>👤 ชื่อผู้ใช้</label>
      <input type="text" id="loginUsername" placeholder="กรอกชื่อผู้ใช้">
    </div>
    <div class="form-group">
      <label>🔒 รหัสผ่าน</label>
      <input type="password" id="loginPassword" placeholder="กรอกรหัสผ่าน" onkeypress="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">🔑 เข้าสู่ระบบ</button>
    <div style="text-align:center;color:#94a3b8;font-size:11px;margin:12px 0">หรือ</div>
    <button class="btn" style="width:100%;justify-content:center;padding:12px;font-size:14px;background:#06C755;color:#fff" onclick="location.href='/auth/line/login'">💬 เข้าสู่ระบบด้วย LINE</button>
  </div>
