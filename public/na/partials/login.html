  <div class="login-container">
    <div class="login-logo">🧑‍🔧</div>
    <h2>ระบบจัดเวรผู้ช่วยพยาบาล<br>โรงพยาบาลลำพูน</h2>
    <div class="alert alert-info" style="font-size:11px">กรุณาเข้าสู่ระบบเพื่อใช้งาน (สำหรับผู้ช่วยพยาบาล NA)</div>
    <div id="loginNotice"></div>
    <div class="form-group">
      <label>👤 ชื่อผู้ใช้</label>
      <input type="text" id="loginUsername" placeholder="กรอกชื่อผู้ใช้">
    </div>
    <div class="form-group">
      <label>🔒 รหัสผ่าน</label>
      <input type="password" id="loginPassword" placeholder="กรอกรหัสผ่าน" onkeypress="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">🔑 เข้าสู่ระบบ</button>
  </div>
